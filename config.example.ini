# TornadoInTui configuration file
#
# Copy this file to:
# ~/.config/tornadointui/config.ini
#
# Command-line arguments override these settings.

[tornado]

# Tornado type.
#
# Available types:
# rope
# cone
# cylinder
# v-shaped
# multivortex
# custom
type = custom

# Tornado width at the top.
#
# Relative to the terminal width.
# Recommended range: 0.01 - 0.40
top_width = 0.24

# Tornado width at the bottom.
#
# Relative to the terminal width.
# Recommended range: 0.01 - 0.30
bottom_width = 0.05

# Controls how quickly the tornado narrows.
#
# Lower values create a wider upper section.
# Higher values create a straighter shape.
# Recommended range: 0.30 - 2.00
curve = 0.80

# Controls horizontal movement.
#
# 0.0 disables movement.
# Higher values increase sway.
# Recommended range: 0.0 - 3.0
sway = 1.00

# Controls animation speed.
#
# Default: 1.00
speed = 1.00

# Controls the breathing effect.
#
# Recommended range: 0.0 - 0.02
breathing = 0.004

# Tornado color (RGB).
#
# Format:
# color = R,G,B
#
# Default:
# 124,199,214
#
# Presets:
# Blue    =  97,175,239
# Cyan    = 124,199,214
# Green   = 152,195,121
# Red     = 224,108,117
# Yellow  = 229,192,123
# White   = 216,222,233
color = 124,199,214

# Characters used to draw the tornado.
#
# Ordered from lightest to darkest.
# Unicode block characters are supported.
shades = ░▒▓█
