# TornadoInTui configuration file
#
# Copy this file to:
# ~/.config/tornadointui/config.ini
#
# Values in this file are used when no command-line flag overrides them.

[tornado]

# Tornado type.
#
# Available built-in types:
# rope
# cone
# cylinder
# v-shaped
# multivortex
# custom
type = custom

# Tornado width at the top.
#
# This value is relative to the terminal width.
# Recommended range: 0.01 to 0.40
top_width = 0.24

# Tornado width at the bottom.
#
# This value is relative to the terminal width.
# Recommended range: 0.01 to 0.30
bottom_width = 0.05

# Controls how quickly the tornado becomes narrower.
#
# Lower values create a wider upper section.
# Higher values create a straighter shape.
# Recommended range: 0.30 to 2.00
curve = 0.80

# Controls horizontal movement.
#
# 0.0 disables movement.
# Higher values make the tornado sway more strongly.
# Recommended range: 0.0 to 3.0
sway = 1.00

# Controls animation speed.
#
# 1.0 is the default speed.
# Lower values make the animation slower.
# Higher values make it faster.
speed = 1.00

# Controls how much the tornado edges expand and contract.
#
# Recommended range: 0.0 to 0.02
breathing = 0.004

# Tornado color in RGB format.
#
# Format:
# red,green,blue
#
# Examples:
# Blue:    97,175,239
# Cyan:    124,199,214
# Red:     224,108,117
# Green:   152,195,121
# Yellow:  229,192,123
# Default: 124,199,214
color = 124,199,214

# Characters used to draw the tornado.
#
# Characters should be ordered from lightest to darkest.
# Unicode block characters are supported.
shades = ░▒▓█
